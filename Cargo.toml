[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95" # egui 0.37's minimum; the build PC pins 1.100.0 in rust-toolchain.toml
publish = false

# Exact pins for the fast-moving crates (docs/research/s0-app-stack-and-build-speed.md §5); upgrade on purpose.
# A dependency is listed here when the first crate needs it, not before.
[workspace.dependencies]
cav-core = { path = "crates/cav-core" }
cav-engine = { path = "crates/cav-engine" }
cav-gpu = { path = "crates/cav-gpu" }
cav-render = { path = "crates/cav-render" }
cav-sim = { path = "crates/cav-sim" }

base64 = "0.23"
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features", "default_fonts"] }
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", default-features = false, features = ["winit"] }
bytemuck = { version = "1.25", features = ["derive"] }
png = "0.18"
pollster = "1.0"
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "macros", "transport-io", "base64"] }
ron = "=0.12.3"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "macros", "io-std"] }
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only" # Cargo's guidance; measured 6 s -> 4.5 s rebuild on the S0 skeleton

[profile.dev.package."*"]
debug = false # dependencies carry no debug info

[profile.dev.package.cav-core]
opt-level = 3 # the hot numerical crate is optimised even in dev (REBUILD §8)

[profile.debugging]
inherits = "dev"
debug = true # full debug info on demand: cargo build --profile debugging
