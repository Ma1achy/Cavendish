# The surface-representation study's CPU bench (not a workspace member): see src/main.rs.
[package]
name = "srbench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Cavendish's polyhedral kernel and cube kernel, for the C1 check and the engine timings.
cav-core = { path = "../../../../crates/cav-core" }
# The GPU bench (src/bin/gpu.rs), at the workspace's pinned versions.
pollster = "1.0"
bytemuck = "1.25"

[profile.release]
opt-level = 3
debug = false

[workspace]

[dependencies.wgpu]
version = "=30.0.2"
default-features = false
features = ["std", "parking_lot", "vulkan", "wgsl"]

