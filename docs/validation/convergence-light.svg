<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="Error against step size for each convergence case, with the expected rate"><title>Error against step size for each convergence case, with the expected rate</title><style>.t{fill:#1d1b19;font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',Arimo,'Nimbus Sans','DejaVu Sans',sans-serif}.m{fill:#3d3a34}.w{fill:#4f4a42}.axis{stroke:#4f4a42;stroke-opacity:0.45;stroke-width:1.5;fill:none}.grid{stroke:#4f4a42;stroke-opacity:0.18;stroke-width:1}.dot{fill:#1d1b19}.ring{fill:none;stroke:#1d1b19;stroke-width:2}.line{stroke:#1d1b19;stroke-width:2;fill:none;stroke-linejoin:round}.thin{stroke:#1d1b19;stroke-opacity:0.35;stroke-width:1.5;fill:none}.tol{stroke:#b5822e;stroke-width:2.5;fill:none}.tolfill{fill:#b5822e}.dash{stroke:#b5822e;stroke-width:2;stroke-dasharray:6 5;fill:none}</style><text class="t" x="2.0" y="30.0" font-size="26" font-weight="500" text-anchor="start">Convergence</text><text class="t m" x="2.0" y="58.0" font-size="18" font-weight="400" text-anchor="start">error against step, both on log scales · dashed: the expected rate through the finest point</text><rect class="axis" x="42" y="90" width="300" height="300"/><line class="dash" x1="42.0" y1="375.4" x2="342.0" y2="110.8"/><text class="t m" x="42.0" y="434.0" font-size="15" font-weight="400" text-anchor="start">order 6.15, expected 6</text><polyline class="line" points="42.0,375.4 142.0,286.6 242.0,195.4 342.0,104.6"/><circle class="dot" cx="342.0" cy="104.6" r="5"/><circle class="dot" cx="242.0" cy="195.4" r="5"/><circle class="dot" cx="142.0" cy="286.6" r="5"/><circle class="dot" cx="42.0" cy="375.4" r="5"/><text class="t" x="42.0" y="80.0" font-size="16" font-weight="400" text-anchor="start">forward.quadrature_order</text><text class="t w" x="42.0" y="412.0" font-size="14" font-weight="400" text-anchor="start">step 10⁻¹ to 10⁰</text><rect class="axis" x="436" y="90" width="300" height="300