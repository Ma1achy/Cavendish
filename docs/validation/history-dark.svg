<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" role="img" aria-label="Each validation case's error as a fraction of its tolerance over time"><title>Each validation case's error as a fraction of its tolerance over time</title><style>.t{fill:#efe9dc;font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',Arimo,'Nimbus Sans','DejaVu Sans',sans-serif}.m{fill:#c8c1b2}.w{fill:#c8c1b2}.axis{stroke:#c8c1b2;stroke-opacity:0.45;stroke-width:1.5;fill:none}.grid{stroke:#c8c1b2;stroke-opacity:0.18;stroke-width:1}.dot{fill:#efe9dc}.ring{fill:none;stroke:#efe9dc;stroke-width:2}.line{stroke:#efe9dc;stroke-width:2;fill:none;stroke-linejoin:round}.thin{stroke:#efe9dc;stroke-opacity:0.35;stroke-width:1.5;fill:none}.tol{stroke:#d9a84e;stroke-width:2.5;fill:none}.tolfill{fill:#d9a84e}.dash{stroke:#d9a84e;stroke-width:2;stroke-dasharray:6 5;fill:none}</style><text class="t" x="2.0" y="30.0" font-size="26" font-weight="500" text-anchor="start">Accuracy over time</text><text class="t m" x="2.0" y="58.0" font-size="18" font-weight="400" text-anchor="start">each line is a case: its error as a fraction of its tolerance, at every commit that changed the report</text><line class="grid" x1="140" y1="436.0" x2="1190" y2="436.0"/><text class="t w" x="132.0" y="441.0" font-size="15" font-weight="400" text-anchor="end">10⁻³</text><line class="grid" x1="140" y1="351.0" x2="1190" y2="351.0"/><text class="t w" x="132.0" y="356.0" font-size="15" font-weight="400" text-anchor="end">10⁻²</text><line class="grid" x1="140" y1="266.0" x2="1190" y2="266.0"/><text class="t w" x="132.0" y="271.0" font-size="15" font-weight="400" text-anchor="end">10⁻¹</text><line class="grid" x1="140" y1="181.0" x2="1190" y2="181.0"/><text class="t w" x="132.0" y="186.0" font-size="15" font-weight="400" text-anchor="end">tolerance</text><line class="grid" x1="140" y1="96.0" x2="1190" y2="96.0"/><text class="t w" x="132.0" y="101.0" font-size="15" font-weight="400" text-anchor="end">10¹</text><text class="t w" x="132.0" y="458.0" font-size="15" font-weight="400" text-anchor="end">exact (0)</text><line class="tol" x1="140" y1="181.0" x2="1190" y2="181.0"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="270.1" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="219.4" r="6" fill-opacity="1"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><circle class="dot" cx="665.0" cy="453.0" r="4" fill-opacity="0.5"/><text class="t w" x="665.0" y="498.0" font-size="14" font-weight="400" text-anchor="middle">11-21 3958444</text><text class="t m" x="1220.0" y="120.0" font-size="16" font-weight="400" text-anchor="start">10 of 10 pass in the latest report</text><text class="t m" x="1220.0" y="146.0" font-size="16" font-weight="400" text-anchor="start">least room to spare:</text><text class="t" x="1220.0" y="172.0" font-size="16" font-weight="500" text-anchor="start">render.gpu_projection</text><text class="t m" x="1220.0" y="198.0" font-size="16" font-weight="400" text-anchor="start">35% of its tolerance</text><text class="t m" x="1220.0" y="224.0" font-size="16" font-weight="400" text-anchor="start">8 cases are exact</text></svg>
