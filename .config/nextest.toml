# A watchdog for every test: one that runs for two minutes is killed and fails. A hang (a loop that
# never ends, a server that never answers) must not sit on the owner's PC until someone notices.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

# Tests that spread their own work over every core run one at a time, not side by side: two of
# them together each take twice as long, and the oracle's cylinder pair then met the watchdog.
[test-groups]
whole-machine = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(validation_cylinder_vs_point_mass) | test(the_point_mass_fails_where_the_script_says)'
test-group = 'whole-machine'

# The scaffold series by the scripts' sampling read every leaf of 48 members at 1 cm at 4672 arm
# heights and five α (6.0e9 cube changes): about 130 s each on the build PC over every core, the
# five α sharing each leaf's offset (TASK-S3-26; 170 s before). S3's review.
[[profile.default.overrides]]
filter = 'test(validation_scaffold_series_against_script) | test(validation_scaffold_multimode_series_against_script)'
test-group = 'whole-machine'
slow-timeout = { period = "60s", terminate-after = 6 }

# The walk's W2/W3 cases (TASK-S5-12) read the town's 3.3 million leaves at eight bases, each over
# every core, and the town read whole: one at a time, and up to three minutes each.
[[profile.default.overrides]]
filter = 'test(validation_slow_the_walk_is_within_its_ledger) | test(validation_slow_the_walk_s_ledger_is_within_its_tolerance) | test(validation_slow_the_walk_s_ledger_is_not_vacuous) | test(slow_the_whole_town_is_read)'
test-group = 'whole-machine'
slow-timeout = { period = "60s", terminate-after = 3 }
# The rings' R1 and its control (TASK-S5-14) read the leaves of what the rings accept on the town
# at eight bases and three tolerances, over every core: one at a time, up to three minutes each.
[[profile.default.overrides]]
filter = 'test(validation_slow_the_rings_reproduce_their_tolerance) | test(slow_the_rings_miss_their_tolerance_at_half_the_radii)'
test-group = 'whole-machine'
slow-timeout = { period = "60s", terminate-after = 3 }
# The paper's benchmark (TASK-S5-18): five bodies on 16 lattices each, 192 flight reads a body
# (what its criteria use; the paper's diagnostic reads 480), over every core but two. One at a time
# among its group, up to three minutes.
[[profile.default.overrides]]
filter = 'test(validation_the_benchmark_bodies_converge)'
test-group = 'whole-machine'
slow-timeout = { period = "60s", terminate-after = 3 }
