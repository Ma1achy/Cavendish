[package]
name = "cav-gpu"
description = "Cavendish: the wgpu device, shared by the renderer and (later) the kernels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true # blocks on the adapter and the device; a browser cannot block

# The web backend (WebGPU only: no WebGL2, docs/research/web-build-and-pages.md §2). Cargo unifies
# features per build, so this reaches egui-wgpu and eframe in the wasm build and nowhere else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# fragile-send-sync-non-atomic-wasm: the web build has no threads (no atomics), so wgpu's handles
# may be Send and Sync there as they are natively; the engine's figure exporter is Send.
wgpu = { workspace = true, features = ["webgpu", "fragile-send-sync-non-atomic-wasm"] }

[lints]
workspace = true
